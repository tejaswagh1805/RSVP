services:
  - type: web
    name: RSVP
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: PUBLIC_SITE_URL
        value: https://rsvp-dxb-customer.onrender.com
      - key: CLIENT_ORIGIN
        value: https://rsvp-dxb-customer.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_1_NAME
        sync: false
      - key: ADMIN_1_EMAIL
        sync: false
      - key: ADMIN_1_PASSWORD
        sync: false
      - key: ADMIN_2_NAME
        sync: false
      - key: ADMIN_2_EMAIL
        sync: false
      - key: ADMIN_2_PASSWORD
        sync: false
      - key: INFOBIP_BASE_URL
        sync: false
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_WHATSAPP_SENDER
        sync: false
      - key: INFOBIP_WEBHOOK_SECRET
        sync: false
